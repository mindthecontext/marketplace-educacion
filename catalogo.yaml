# Qué es este catálogo y a quién sirve.
#
# ES UN ÍNDICE DELGADO: no contiene ningún plugin, los referencia por git-subdir contra el
# repositorio público de cada paquete, fijando un `ref`. Nada de lo que hay aquí se edita a
# mano — `catalogos.py` lo deriva de los descriptores de los saberes.
#
# Publico: un colegio tiene que poder resolverlo sin cuenta de GitHub.

# El identificador que Claude Code exige: kebab-case, sin espacios. NO es el título — ese
# vive en `descripcion`, que es lo que el cliente muestra.
identificador: mindthecontext-educacion

# Título legible. Sólo informativo dentro de este archivo.
nombre: MindTheContext · Educación
descripcion: >-
  Saberes para la sala de clases: criterio didactico sobre el curriculum chileno, con la procedencia a la vista.

# La variante que sirve. `universal` (mcp-compartido#119): la carpeta con los manifiestos de Claude y
# de Codex y las skills con `name:`, que sirve a Claude Y al workspace de ChatGPT desde la misma
# entrada. Cada entrada sirve `universal/` en las versiones que la traen y `claude/` en las
# anteriores; la carpeta cambia sola al promover.
variante: universal
